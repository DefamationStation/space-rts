name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit and guard tests
        run: npm test

      - name: Verify determinism (5 seeds x 5 mins)
        run: npm run sim -- --seeds=1..5 --minutes=5 --verify
